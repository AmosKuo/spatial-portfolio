            letter-spacing: 2px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;

        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--text-color);
            color: #fff;

        }

        .category-header {
            text-align: left;
            margin: 3.5rem 0 1.8rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;

        .category-title {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 3px;
        }

        .category-badge {
            font-size: 0.75rem;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .cafe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .cafe-photo-item {
            position: relative;
            background: #f7f7f7;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 4/3;
        }

        .cafe-photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            display: block;
        }

        .cafe-photo-item:hover img {
            transform: scale(1.05);
        }

        /* Pure Minimalist Lightbox */
        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 10, 10, 0.95);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .lightbox-modal.active {
            display: flex;
        }

        .lightbox-box {
            position: relative;
            max-width: 1200px;
            max-height: 92vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 88vh;
            object-fit: contain;
            user-select: none;
        }

        .lightbox-close {
            position: absolute;
            top: -45px;
            right: 0;
            color: #fff;
            font-size: 2.2rem;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .lightbox-close:hover {
            opacity: 1;
        }

        .lightbox-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: none;
            font-size: 1.6rem;
            padding: 1.2rem 1.4rem;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.3s ease;
            user-select: none;
        }

        .lightbox-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        .lightbox-btn.prev { left: -70px; }
        .lightbox-btn.next { right: -70px; }

        @media (max-width: 768px) {
            .cafe-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .lightbox-btn.prev { left: 10px; }
            .lightbox-btn.next { right: 10px; }
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const filterBtns = document.querySelectorAll(".filter-btn");
            const catSections = document.querySelectorAll(".cat-section");

            filterBtns.forEach(btn => {
                btn.addEventListener("click", function() {
                    filterBtns.forEach(b => b.classList.remove("active"));
                    this.classList.add("active");

                    const filter = this.getAttribute("data-filter");

                    catSections.forEach(sec => {
                        if (filter === "all" || sec.getAttribute("data-cat") === filter) {
                            sec.style.display = "block";
                        } else {
                            sec.style.display = "none";
                        }
                    });
                });
            });

            const getVisibleItems = () => Array.from(document.querySelectorAll(".cafe-photo-item")).filter(el => el.closest(".cat-section").style.display !== "none");
            
            const modal = document.getElementById("lightbox-modal");
            const modalImg = document.getElementById("lightbox-img");
            const closeBtn = document.getElementById("lightbox-close");
            const prevBtn = document.getElementById("lightbox-prev");
            const nextBtn = document.getElementById("lightbox-next");

            let currentIndex = 0;
            let activeItems = [];

            function showLightbox(idx) {
                activeItems = getVisibleItems();
                if (!activeItems.length) return;

                if (idx < 0) idx = activeItems.length - 1;
                if (idx >= activeItems.length) idx = 0;

                currentIndex = idx;
                const item = activeItems[currentIndex];
                modalImg.src = item.getAttribute("data-img");
                modal.classList.add("active");
            }

            function hideLightbox() {
                modal.classList.remove("active");
            }

            document.querySelectorAll(".cafe-photo-item").forEach(item => {
                item.addEventListener("click", function() {
                    activeItems = getVisibleItems();
                    const idx = activeItems.indexOf(this);
                    if (idx !== -1) showLightbox(idx);
                });
            });

            closeBtn.addEventListener("click", hideLightbox);

            prevBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                showLightbox(currentIndex - 1);
            });

            nextBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                showLightbox(currentIndex + 1);
            });

            modal.addEventListener("click", (e) => {
                if (e.target === modal) hideLightbox();
            });

            document.addEventListener("keydown", (e) => {
                if (!modal.classList.contains("active")) return;
                if (e.key === "Escape") hideLightbox();
                if (e.key === "ArrowLeft") showLightbox(currentIndex - 1);
                if (e.key === "ArrowRight") showLightbox(currentIndex + 1);
            });
        });
    </script>
